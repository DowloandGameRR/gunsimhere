function mergeStatic(){

  walls.children.forEach(m=>{

    const {mt, l} = by[k];
    let n = 0, ni = 0;
    for(const m of l){
      n += m.geometry.attributes.position.count;
      if(m.geometry.index) ni += m.geometry.index.count;
    }
    
    const P = new Float32Array(n*3), N = new Float32Array(n*3), U = new Float32Array(n*2), I = ni ? new Uint32Array(ni) : null;

        for(let i = 0; i < ix.length; i++) I[oi + i] = ix[i] + o;

    M.frustumCulled = false;
    M.matrixAutoUpdate = false;
    scene.add(M);
  }

  g.visible=p.a==1;const f=Math.min(1,dt*12),ox=g.position.x,oz=g.position.z;g.position.x+=(p.x-ox)*f;g.position.y+=(p.y-g.position.y)*f;g.position.z+=(p.z-oz)*f;g.rotation.y=p.r;const vs=Math.hypot(g.position.x-ox,g.position.z-oz)/dt,am=Math.min(.9,vs*.12);q.ph=(q.ph||0)+vs*dt*1.6;const sw=Math.sin(q.ph)*am;q.L.rotation.x=sw;q.R.rotation.x=-sw;q.al.rotation.x=-sw*.6;if(q.fl.visible&&now>q.fo)q.fl.visible=false}
 sendT+=dt;if(online&&sendT>.1){sendT=0;const m={x:+pos.x.toFixed(2),y:+pos.y.toFixed(2),z:+pos.z.toFixed(2),r:+yaw.toFixed(2),hp,a:alive?1:0,w:cur,s:sc},j=JSON.stringify(m);if(j!=lastJ||now-lastSend>1500){lastJ=j;lastSend=now;db.ref(`r/${room}/p/${id}`).update(m)}}
 hudT+=dt;if(hudT>.1){hudT=0;$('hf').style.width=Math.max(0,hp)+'%';setH('st',`${W[cur].n}<br>${reloading?'şarjör...':ammo[cur]+' / '+(ch.ammo?'∞':res[cur])}`);
  const arr=[[name,kills,deaths],...Object.values(pl).map(q=>[q.p.n,q.p.k||0,q.p.d||0])].sort((a,b)=>b[1]-a[1]).slice(0,6);
  setH('sc','Oda: '+room+'<br>'+arr.map(a=>`${a[0]} ${a[1]}/${a[2]}`).join('<br>'));
  if(ch.radar)radar()}
}
function radar(){const x=$('rd').getContext('2d'),s=Math.sin(yaw),c=Math.cos(yaw);x.clearRect(0,0,120,120);x.fillStyle='#0f0';x.fillRect(58,58,4,4);
 x.fillStyle='#f33';for(const k in pl){const p=pl[k].p;if(p.a!=1)continue;const dx=p.x-pos.x,dz=p.z-pos.z,rx=dx*c-dz*s,fw=-dx*s-dz*c;if(Math.hypot(rx,fw)<48)x.fillRect(58+rx*1.2,58-fw*1.2,4,4)}}
let last=performance.now();
function loop(){requestAnimationFrame(loop);const now=performance.now();if(S.cap&&now-last<1000/S.cap-3)return;const dt=Math.min((now-last)/1000,.05);last=now;if(started)update(dt,now);ren.render(scene,cam);
 // Otomatik kalite: kasarsa çözünürlüğü düşür
 fa+=(dt*1000-fa)*.05;qT+=dt;fpsT+=dt;if(qT>2){qT=0;if(S.q!='auto');else if(fa>26&&pr>.4){pr-=.15;rs()}else if(fa<12&&pr<1&&!lowQ){pr=Math.min(1,pr+.1);rs()}}
 if(ch.fps&&fpsT>.5){fpsT=0;$('fps').textContent=Math.round(1000/fa)+' FPS · çözünürlük x'+pr.toFixed(2)}}loop();

// ---- Girdi ----
addEventListener('mousemove',e=>{if(!locked)return;const s=zoom&&cur==3?sens*.36:sens;yaw-=e.movementX*s;pitch-=e.movementY*s});
addEventListener('mousedown',e=>{if(!locked)return;if(e.button==0){down=1;if(!W[cur].auto)shoot()}if(e.button==2)zoom=1});
addEventListener('mouseup',e=>{if(e.button==0)down=0;if(e.button==2)zoom=0});
addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement==cv;if(!locked){down=0;zoom=0}});
cv.addEventListener('click',()=>{if(started&&$('con').style.display!='flex'&&stg.style.display!='flex')cv.requestPointerLock()});
const CH=[['god','Ölümsüzlük'],['ammo','Sonsuz mermi'],['speed','Hız x3'],['jump','Süper zıplama'],['fly','Uçma (Space / C)'],['esp','Duvar hilesi (ESP)'],['aim','Aimbot'],['dmg','Tek atış öldür'],['norec','Geri tepme/saçılma yok'],['rapid','Hızlı ateş'],['trig','Triggerbot'],['radar','Radar'],['fps','FPS göstergesi']];
function tg(k,v){ch[k]=v===undefined?!ch[k]:v;const c=$('c_'+k);if(c)c.checked=!!ch[k];if(k=='esp')for(const q in pl)setESP(pl[q]);if(k=='radar')$('rd').style.display=ch[k]?'block':'none';if(k=='fps')$('fps').style.display=ch[k]?'block':'none';if(k=='fps'){S.fps=ch.fps?1:0;sv();$('sfps').checked=!!ch.fps}log(`${k}: ${ch[k]?'AÇIK':'KAPALI'}`)}
$('cm').innerHTML='<b style="color:#f55">HİLE MENÜSÜ</b> (F1-F9 · kapatmak: konsola kapa123)'+CH.map((c,i)=>`<label><input type="checkbox" id="c_${c[0]}" onchange="tg('${c[0]}')"> ${i<9?'F'+(i+1)+' ':''}${c[1]}</label>`).join('')+'<button onclick="hp=100;alive=1" style="margin-top:6px">Canı doldur</button> <button onclick="$(\'cm\').style.display=\'none\'">Kapat</button>';
const cs=$('con'),ci=$('ci');
function log(t){$('cl').innerHTML+=t+'<br>';$('cl').scrollTop=1e6}
function conT(){const o=cs.style.display=='flex';cs.style.display=o?'none':'flex';if(!o){document.exitPointerLock();for(const k in keys)keys[k]=0;setTimeout(()=>ci.focus(),30)}else if(started)cv.requestPointerLock()}
function cmd(v){const a=v.toLowerCase().split(/\s+/),c=a[0];
 if(c=='kapa123'){CH.forEach(x=>tg(x[0],0));unlocked=0;$('cm').style.display='none';log('Hile menüsü kapatıldı')}
 else if(c=='ruzo123'){unlocked=1;$('cm').style.display='block';log('HİLELER AÇILDI! komutlar: '+CH.map(x=>x[0]).join(' ')+' all off heal bot [sayı] sens [x] fov [x] low high')}
 else if(c=='help')log('komutlar: clear, help, fps, low, high'+(unlocked?' + hile komutları (menüye bak)':''));
 else if(c=='clear')$('cl').innerHTML='';
 else if(c=='fps')tg('fps');
 else if(c=='low'){S.q='low';sv();applyQ();ui();log('Düşük kalite açık')}
 else if(c=='high'){S.q='auto';sv();applyQ();ui();log('Normal kalite')}
 else if(!unlocked)log('bilinmeyen komut');
 else if(CH.some(x=>x[0]==c))tg(c);
 else if(c=='all')CH.forEach(x=>tg(x[0],1));
 else if(c=='off')CH.forEach(x=>tg(x[0],0));
 else if(c=='heal'){hp=100;alive=1;W.forEach((w,i)=>{ammo[i]=w.mag;res[i]=w.mag*4});log('Can ve mermi dolduruldu')}
 else if(c=='bot'){if(online)log('Online modda bot yok');else{bots(Math.min(12,+a[1]||4));log('Botlar eklendi')}}
 else if(c=='sens'){S.sens=+a[1]||1;sv();ap();log('Hassasiyet x'+(a[1]||1))}
 else if(c=='fov'){log('FOV sabit 75 (nişanla yakınlaşır)')}
 else log('bilinmeyen komut')}
ci.onkeydown=e=>{e.stopPropagation();if(e.code=='Escape'||e.code=='Backquote'||(e.code=='KeyE'&&!ci.value)){e.preventDefault();conT()}else if(e.key=='Enter'){const v=ci.value.trim();ci.value='';if(v){log('> '+v);cmd(v)}}};
addEventListener('keydown',e=>{if(!started)return;
 if(cs.style.display!='flex'&&(e.code=='KeyE'||e.code=='Backquote')){e.preventDefault();conT();return}
 if(cs.style.display=='flex'||stg.style.display=='flex')return;keys[e.code]=1;
 if(e.code=='KeyR')reload();if(/^Digit[1-5]$/.test(e.code))setW(+e.code[5]-1);
 const m=/^F([1-9])$/.exec(e.code);if(m&&unlocked&&CH[m[1]-1]){e.preventDefault();tg(CH[m[1]-1][0])}});
addEventListener('keyup',e=>keys[e.code]=0);
addEventListener('wheel',e=>{if(locked)setW((cur+(e.deltaY>0?1:4))%5)});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0;down=0});

// ---- Ayarlar ----
const stg=$('set');
function ui(){$('s_sens').value=S.sens;$('s_fov').value=S.fov;$('s_vol').value=S.vol;$('s_q').value=S.q;$('s_cap').value=S.cap;$('s_xh').value=S.xh;$('sfps').checked=!!S.fps;$('s_bob').checked=!!S.bob;$('v_sens').textContent=(+S.sens).toFixed(2)+'x';$('v_fov').textContent=S.fov+'°';$('v_vol').textContent=Math.round(S.vol*100)+'%'}
function ap(){sens=.0022*S.sens;$('cross').style.color=S.xh;ui()}
for(const[id,k,f]of[['s_sens','sens',Number],['s_fov','fov',Number],['s_vol','vol',Number],['s_xh','xh',String]])$(id).oninput=e=>{S[k]=f(e.target.value);sv();ap()};
$('s_q').onchange=e=>{S.q=e.target.value;sv();applyQ()};
$('s_cap').onchange=e=>{S.cap=+e.target.value;sv()};
$('sfps').onchange=e=>tg('fps',e.target.checked);
$('s_bob').onchange=e=>{S.bob=e.target.checked?1:0;sv()};
function setT(o){stg.style.display=o?'flex':'none';if(o){document.exitPointerLock();for(const k in keys)keys[k]=0}else if(started)cv.requestPointerLock()}
$('sb').onclick=()=>setT(1);$('sx').onclick=()=>setT(0);
addEventListener('keydown',e=>{if(e.code=='KeyP'&&started&&cs.style.display!='flex'){e.preventDefault();setT(stg.style.display!='flex')}});
$('rm').oninput=e=>{e.target.value=e.target.value.replace(/\D/g,'')};
ap();applyQ();if(S.fps)tg('fps',1);

// ---- Başlat ----
$('go').onclick = () => {
  name = ($('nm').value.trim() || 'Oyuncu' + Math.floor(Math.random() * 99)).replace(/[<>&]/g, '');
  room = ($('rm').value.replace(/\D/g, '').slice(0, 6) || String(1000 + Math.random() * 9000 | 0));
  
  $('lobby').style.display = 'none';
  
  // Oyunu başlat ve doğ
  spawn();
  started = 1;

  if (online) join();
  else bots(4);

  // Farenin ekrana kilitlenmesi için canvas'a odaklan ve kilit isteği gönder
  setTimeout(() => {
    cv.focus();
    cv.requestPointerLock();
  }, 100);
};

// Ekstra güvenlik: Eğer ilk kilitlenme başarısız olursa, oyun ekranının herhangi bir yerine tıklandığında kilitlensin
cv.addEventListener('click', () => {
  if (started && $('con').style.display != 'flex' && stg.style.display != 'flex') {
    cv.requestPointerLock();
  }
});
</script></body></html>
